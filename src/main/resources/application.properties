# Database Configuration (auto-configured by Spring Boot Docker Compose)
# spring.datasource.url=jdbc:postgresql://localhost:5432/jobinterview
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb.core.internal.sqlscript=DEBUG
logging.level.org.springframework.web.servlet=INFO
logging.level.com.mikescherbakov.jobinterviewbase=INFO

# Actuator Configuration
management.prometheus.metrics.export.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
logging.level.root=ERROR

# Docker Configuration
spring.docker.compose.lifecycle-management=start-and-stop
