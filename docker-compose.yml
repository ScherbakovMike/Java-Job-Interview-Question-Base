services:
  postgres:
    image: postgres:17-alpine
    container_name: job-interview-postgres
    environment:
      POSTGRES_DB: jobinterview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobinterview"]
      interval: 10s
      timeout: 5s
      retries: 5